<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlanta Dish Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1c1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DishFinder">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3170/3170733.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</head>
<body class="bg-[#faf9f6] text-stone-900 min-h-screen py-12 px-4 selection:bg-amber-100 selection:text-amber-900">

  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-10">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase bg-amber-50 text-amber-800 border border-amber-200/60 mb-3 shadow-sm">
        Curated Metro Atlanta Eats
      </span>
      <h1 class="text-4xl font-extrabold tracking-tight text-stone-900 sm:text-5xl">
        Dish Finder
      </h1>
      <p class="text-stone-500 mt-2 text-base max-w-lg mx-auto leading-relaxed">
        Real-time consensus from local Reddit threads, diner reviews, and acclaimed food critics.
      </p>
    </header>

    <!-- Settings & Search Box -->
    <div class="bg-white rounded-2xl border border-stone-200/80 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] p-6 mb-8 transition-all">
      
      <!-- API Key Accordion / Quick View -->
      <div class="mb-5 pb-5 border-b border-stone-100">
        <label class="block text-[11px] font-bold text-stone-400 uppercase tracking-wider mb-1.5">Google AI Studio API Key</label>
        <div class="relative">
          <input id="apiKey" type="password" placeholder="Paste your API key starting with AIza..." class="w-full text-sm bg-stone-50/50 hover:bg-white text-stone-800 pl-3.5 pr-10 py-2.5 border border-stone-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-600 transition">
        </div>
        <p class="text-[11px] text-stone-400 mt-1.5">Stored securely in your local browser storage. Never transmitted elsewhere.</p>
      </div>

      <!-- Search Input -->
      <div>
        <label class="block text-[11px] font-bold text-stone-400 uppercase tracking-wider mb-1.5">What are you craving?</label>
        <div class="flex flex-col sm:flex-row gap-2.5">
          <div class="relative flex-1">
            <input id="dishInput" type="text" placeholder="e.g. vegetarian biryani, smoked lemon pepper wings, banh mi" class="w-full text-sm text-stone-800 px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-600 shadow-sm transition placeholder:text-stone-400">
          </div>
          <button id="searchBtn" onclick="findDish()" class="bg-stone-900 hover:bg-stone-800 active:scale-[0.98] text-white font-semibold text-sm px-7 py-3 rounded-xl transition shadow-sm hover:shadow flex items-center justify-center gap-2">
            <span>Find Spots</span>
          </button>
        </div>

        <div class="mt-3 flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-xs text-stone-500 cursor-pointer select-none group">
            <input id="bypassCache" type="checkbox" class="w-3.5 h-3.5 rounded border-stone-300 text-stone-900 focus:ring-0 cursor-pointer">
            <span class="group-hover:text-stone-700 transition">Force fresh search (bypass cache)</span>
          </label>
          <span class="text-[11px] text-stone-400">Strictly verified open in 2026</span>
        </div>
      </div>
    </div>

    <!-- Loading Skeleton -->
    <div id="loading" class="hidden space-y-4 py-4">
      <div class="flex items-center justify-center gap-2.5 text-stone-500 text-sm font-medium py-3">
        <svg class="animate-spin h-4 w-4 text-amber-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span id="loadingText">Gathering fresh culinary intel across metro Atlanta...</span>
      </div>
      <div class="space-y-3 opacity-60 animate-pulse">
        <div class="h-28 bg-stone-200/70 rounded-2xl"></div>
        <div class="h-28 bg-stone-200/70 rounded-2xl"></div>
        <div class="h-28 bg-stone-200/70 rounded-2xl"></div>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 rounded-2xl p-4 text-xs text-red-700 font-medium mb-6"></div>

    <!-- Results Container -->
    <main id="results" class="space-y-10"></main>
  </div>

  <script>
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('apiKey').addEventListener('input', (e) => {
      localStorage.setItem('gemini_api_key', e.target.value.trim());
    });

    async function findDish() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const dish = document.getElementById('dishInput').value.trim();
      const bypassCache = document.getElementById('bypassCache').checked;
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('errorBanner');
      const resultsEl = document.getElementById('results');

      if (!apiKey) {
        alert('Please paste your Google AI Studio API key first.');
        return;
      }
      if (!dish) {
        alert('Please enter a dish craving.');
        return;
      }

      errorEl.classList.add('hidden');
      errorEl.innerText = '';

      const cacheKey = `dish_v6_${dish.toLowerCase().replace(/\s+/g, '_')}`;
      if (!bypassCache) {
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) {
          renderGroupedCards(JSON.parse(cachedData));
          return;
        }
      }

      loadingEl.classList.remove('hidden');
      resultsEl.innerHTML = '';

      const currentYear = new Date().getFullYear();
      const systemPrompt = `You are an expert local food editor and researcher for the Atlanta metro area.
Your task is to recommend verified standout spots across the entire metro area (including Atlanta intown, Decatur, Buford Hwy, Duluth, Alpharetta, Sandy Springs, Marietta, Woodstock, etc.) for the specific dish requested.

CRITICAL OPERATIONAL RULES:
1. Operational check: Every single restaurant MUST BE CURRENTLY OPEN AND OPERATING in ${currentYear}. If a spot has permanently closed (e.g. Ghee Indian Kitchen, shuttered venues), DO NOT include it. Verify that it is currently active.
2. Multi-location handling: Identify all active locations in the metro area (such as Decatur, Alpharetta, Sandy Springs, Marietta) and include them inside the "locations" array.
3. Freshness: Favor reviews, menus, and discussions from the past 12 months.
4. Categories and strict quota:
   - You MUST provide EXACTLY 3 distinct recommendations for EACH of the three categories (3 for "The Street Pick", 3 for "The Crowd Favorite", and 3 for "The Critic Pick"), yielding exactly 9 spots total.
   - "The Street Pick": Highest community consensus on r/Atlanta or r/AtlantaEats.
   - "The Crowd Favorite": High review volume and consistent praise on recent Google reviews.
   - "The Critic Pick": Respected spots highlighted by Eater Atlanta, AJC, Atlanta Magazine, or Michelin Guide. If no critic piece exists on this exact dish, recommend a celebrated, open critic favorite specializing in this regional cuisine.

Return ONLY a valid JSON array of objects matching the schema.`;

      const requestBody = {
        contents: [{ parts: [{ text: `Find the best "${dish}" in the Atlanta metro area. You MUST provide EXACTLY 3 distinct spots for EACH category: exactly 3 for Street Pick, exactly 3 for Crowd Favorite, and exactly 3 for Critic Pick (9 total spots). Ensure every spot is verified open today.` }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        tools: [{ googleSearch: {} }],
        generationConfig: {
          temperature: 0.2,
          responseMimeType: "application/json",
          responseSchema: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                category: { type: "STRING", enum: ["The Street Pick", "The Crowd Favorite", "The Critic Pick"] },
                rank: { type: "INTEGER" },
                name: { type: "STRING" },
                locations: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      neighborhood: { type: "STRING" },
                      address: { type: "STRING" }
                    },
                    required: ["neighborhood"]
                  }
                },
                why: { type: "STRING" },
                what_people_say: { type: "STRING" },
                source: { type: "STRING" },
                price: { type: "STRING" }
              },
              required: ["category", "rank", "name", "locations", "why", "what_people_say", "source"]
            }
          }
        }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const spots = JSON.parse(rawText);

        localStorage.setItem(cacheKey, JSON.stringify(spots));
        renderGroupedCards(spots);
      } catch (err) {
        errorEl.innerText = `Error: ${err.message}`;
        errorEl.classList.remove('hidden');
      } finally {
        loadingEl.classList.add('hidden');
      }
    }

    function renderGroupedCards(spots) {
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';

      const categories = [
        {
          id: "The Street Pick",
          title: "The Street Pick",
          subtitle: "Unfiltered consensus from r/Atlanta and local diner forums",
          accentColor: "bg-orange-500",
          tagBg: "bg-orange-50",
          tagText: "text-orange-900 border-orange-200"
        },
        {
          id: "The Crowd Favorite",
          title: "The Crowd Favorite",
          subtitle: "High-volume praise and consistent ratings from recent reviews",
          accentColor: "bg-blue-600",
          tagBg: "bg-blue-50",
          tagText: "text-blue-900 border-blue-200"
        },
        {
          id: "The Critic Pick",
          title: "The Critic Pick",
          subtitle: "Acclaimed by Eater Atlanta, AJC, and regional dining guides",
          accentColor: "bg-emerald-600",
          tagBg: "bg-emerald-50",
          tagText: "text-emerald-900 border-emerald-200"
        }
      ];

      categories.forEach(cat => {
        const catSpots = spots
          .filter(s => s.category === cat.id)
          .sort((a, b) => (a.rank || 0) - (b.rank || 0))
          .slice(0, 3);

        if (catSpots.length === 0) return;

        const section = document.createElement('section');
        section.className = 'space-y-4';

        section.innerHTML = `
          <div class="flex items-center gap-3 border-b border-stone-200/80 pb-3">
            <span class="w-2.5 h-2.5 rounded-full ${cat.accentColor}"></span>
            <div>
              <h2 class="text-xl font-bold text-stone-900 tracking-tight">${cat.title}</h2>
              <p class="text-xs text-stone-500">${cat.subtitle}</p>
            </div>
          </div>
        `;

        const listContainer = document.createElement('div');
        listContainer.className = 'grid gap-4';

        catSpots.forEach((spot, idx) => {
          const locs = Array.isArray(spot.locations) ? spot.locations : [];
          let locationHtml = '';

          if (locs.length === 1) {
            const loc = locs[0];
            const displayLabel = loc.address || loc.neighborhood || 'Atlanta Metro';
            const query = `${spot.name} ${displayLabel}`;
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
            locationHtml = `
              <a href="${mapsUrl}" target="_blank" class="inline-flex items-center gap-1 text-xs text-stone-500 hover:text-stone-800 transition">
                <svg class="w-3 h-3 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>${displayLabel}</span>
              </a>`;
          } else if (locs.length > 1) {
            const chips = locs.map(loc => {
              const label = loc.neighborhood || loc.address;
              const query = `${spot.name} ${loc.address || loc.neighborhood}`;
              const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
              return `<a href="${mapsUrl}" target="_blank" class="inline-flex items-center text-[11px] bg-stone-100/80 hover:bg-stone-200/80 text-stone-700 px-2 py-0.5 rounded-md border border-stone-200/60 transition">📍 ${label}</a>`;
            }).join(' ');
            locationHtml = `
              <div class="flex flex-wrap items-center gap-1.5 mt-0.5">
                <span class="text-[11px] font-semibold text-stone-400">Branches:</span>
                ${chips}
              </div>`;
          } else {
            const queryTarget = `${spot.name} Atlanta`;
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryTarget)}`;
            locationHtml = `<a href="${mapsUrl}" target="_blank" class="text-xs text-stone-500 hover:text-stone-800 transition">📍 Find Atlanta locations on Google Maps</a>`;
          }

          const whyText = spot.why || spot.why_it_hits || spot.reason || "Consensus favorite for this dish.";
          const dinerText = spot.what_people_say || spot.diner_consensus || spot.word_on_the_street || "Consistently recommended by local diners.";
          const sourceText = spot.source || "Atlanta community consensus";

          const card = document.createElement('article');
          card.className = 'bg-white rounded-2xl border border-stone-200/70 p-5 shadow-[0_2px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_24px_-4px_rgba(0,0,0,0.06)] hover:border-stone-300 transition duration-200 space-y-3.5';
          
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center justify-center w-5 h-5 text-[11px] font-bold rounded-full border ${cat.tagBg} ${cat.tagText}">
                    ${idx + 1}
                  </span>
                  <h3 class="text-lg font-bold text-stone-900 tracking-tight leading-snug">${spot.name}</h3>
                </div>
                ${locationHtml}
              </div>
              ${spot.price ? `<span class="text-xs font-semibold bg-stone-100 text-stone-700 px-2.5 py-1 rounded-lg shrink-0">${spot.price}</span>` : ''}
            </div>

            <div class="space-y-2 pt-0.5">
              <div>
                <span class="block text-[10px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Why It Excels</span>
                <p class="text-xs text-stone-700 leading-relaxed">${whyText}</p>
              </div>
              <div class="bg-stone-50/80 rounded-xl p-3 border border-stone-100">
                <span class="block text-[10px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Diner Take & Tips</span>
                <p class="text-xs text-stone-600 leading-relaxed italic">"${dinerText}"</p>
              </div>
            </div>

            <div class="pt-2.5 border-t border-stone-100 flex items-center justify-between text-[11px] text-stone-400">
              <span class="font-medium">Source: <span class="text-stone-500">${sourceText}</span></span>
            </div>
          `;
          listContainer.appendChild(card);
        });

        section.appendChild(listContainer);
        resultsEl.appendChild(section);
      });
    }

    document.getElementById('dishInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') findDish();
    });
  </script>
</body>
</html>
